<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Housing">
  <defs>
    <linearGradient id="mr-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="55%" stop-color="#820AD1" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="mr-tower" x1="16" y1="6" x2="16" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
  </defs>

  <!-- Rounded squircle base with subtle light rim for dark/light browser tab contrast -->
  <rect width="32" height="32" rx="8" fill="url(#mr-bg)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="#F3E8FF" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Subtle radar/compass sweep arc -->
  <path
    d="M6.5 15.5A9.5 9.5 0 0 1 25.5 15.5"
    fill="none"
    stroke="#E9D5FF"
    stroke-opacity="0.45"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Left secondary building wing -->
  <path
    d="M7 16.5L12 14V25H7V16.5Z"
    fill="#D8B4FE"
    fill-opacity="0.85"
  />

  <!-- Center architectural tower with pitched roof apex -->
  <path
    d="M11.5 11.5L16 7L20.5 11.5V25H11.5V11.5Z"
    fill="url(#mr-tower)"
  />

  <!-- Right secondary building wing -->
  <path
    d="M20.5 14.5L25 16.5V25H20.5V14.5Z"
    fill="#C084FC"
    fill-opacity="0.9"
  />

  <!-- Crisp architectural windows on main tower -->
  <rect x="13.5" y="12.5" width="2" height="2" rx="0.5" fill="#6B21A8" />
  <rect x="16.5" y="12.5" width="2" height="2" rx="0.5" fill="#6B21A8" />
  <rect x="13.5" y="16" width="2" height="2" rx="0.5" fill="#6B21A8" />
  <rect x="16.5" y="16" width="2" height="2" rx="0.5" fill="#6B21A8" />
  <rect x="14.75" y="20" width="2.5" height="5" rx="0.75" fill="#581C87" />

  <!-- Radar beacon / location pin dot at apex -->
  <circle cx="16" cy="5.25" r="1.5" fill="#FDE047" />

  <!-- Ground baseline -->
  <path d="M5.5 25H26.5" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" />
</svg>
